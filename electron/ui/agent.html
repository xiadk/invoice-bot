<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>催收小助手</title>
<style>
  :root { --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
          --bg:#f5f7fb; --card:#fff; --line:#e5e9f2; --ink:#1f2937; --mut:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { padding:18px 18px 24px; }
  h1 { font-size:17px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .ver { font-size:11px; color:var(--mut); font-weight:400; }
  .sub { color:var(--mut); font-size:12px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; }
  .row + .row { border-top:1px dashed var(--line); }
  .k { color:var(--mut); font-size:12px; }
  .v { font-weight:600; text-align:right; word-break:break-all; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .g { background:var(--ok); } .y { background:var(--warn); } .r { background:var(--err); } .n { background:#9ca3af; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink);
           border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:#cbd5e1; background:#f8fafc; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.primary:hover { background:var(--brand-d); }
  button.danger { color:var(--err); border-color:#fecaca; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  button.mini { padding:4px 10px; font-size:12px; border-radius:6px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:disabled:hover { border-color:var(--line); background:#fff; }
  .hint { font-weight:400; font-size:11px; color:var(--mut); }
  .st { font-size:12px; font-weight:600; }
  .st.on { color:var(--ok); }
  .st.off { color:var(--mut); }
  .msg { font-size:12px; margin-top:8px; display:none; }
  .msg.ok { display:block; color:var(--ok); }
  .msg.err { display:block; color:var(--err); }
  .tip { font-size:12px; color:var(--mut); background:#fff; border:1px dashed var(--line);
         border-radius:8px; padding:10px 12px; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--mut); word-break:break-all; }
  .hide { display:none; }
  /* 版本更新横幅 */
  .upd { border-color:#fecaca; background:#fef2f2; }
  .upd .k { font-size:13px !important; color:var(--err) !important; font-weight:600; }
  .upd-desc { font-size:12px; color:#7f1d1d; line-height:1.75; margin:4px 0 0; }
  .bar { height:6px; background:#fee2e2; border-radius:99px; overflow:hidden; margin-top:10px; display:none; }
  .bar.on { display:block; }
  .bar i { display:block; height:100%; width:0; background:var(--err); transition:width .25s ease; }
</style>
</head>
<body>
<div class="wrap">
  <h1>催收小助手 <span class="ver" id="ver"></span></h1>
  <p class="sub">在本机浏览器里帮你逐条发送催收消息。服务器只下发任务、记录结果。</p>

  <!-- 版本更新横幅：服务器在连接建立时做体检，版本过旧才出现（默认隐藏） -->
  <div class="card upd" id="updCard" style="display:none">
    <div class="row" style="border-top:none;padding-top:0">
      <span class="k">⚠ 助手版本过旧</span>
      <span class="v" id="updVer">—</span>
    </div>
    <div class="upd-desc" id="updDesc">当前版本已不被支持，建议尽快更新。</div>
    <div class="bar" id="updBarWrap"><i id="updBar"></i></div>
    <div class="btns" style="margin-top:10px">
      <button class="primary" id="btnUpdate">立即更新</button>
      <button id="btnUpdateLater">稍后提醒我</button>
    </div>
    <div class="msg" id="updMsg"></div>
  </div>

  <div class="card">
    <div class="row"><span class="k">连接状态</span><span class="v" id="conn"><i class="dot n"></i>检测中…</span></div>
    <div class="row"><span class="k">1688 登录</span><span class="v" id="login"><i class="dot n"></i>未知</span></div>
    <div class="row"><span class="k">服务器</span><span class="v mono" id="server">—</span></div>
    <div class="row"><span class="k">本机设备</span><span class="v" id="device">—</span></div>
  </div>

  <div class="card" id="taskCard">
    <div class="row"><span class="k">发送状态</span><span class="v" id="taskState">空闲</span></div>
    <div class="btns" style="margin-top:10px">
      <button class="primary" id="btnLogin">打开 1688 登录窗口</button>
      <button class="danger hide" id="btnStop">停止发送</button>
    </div>
  </div>

  <!-- 本机登录态：网站点「退出账号」时服务器会下发指令清掉这里；
       助手当时不在线、或想把本机残留清干净时，就在这里手动点「退出」。 -->
  <div class="card" id="localCard">
    <div class="row">
      <span class="k">本机登录态 <span class="hint">（站点上点「退出账号」会自动退出这里）</span></span>
      <span class="v"></span>
    </div>
    <div class="row">
      <span class="k">拼多多</span>
      <span class="v"><span class="st off" id="st-pdd">…</span> <button class="mini" data-target="pdd">退出</button></span>
    </div>
    <div class="row">
      <span class="k">牵牛花</span>
      <span class="v"><span class="st off" id="st-qnh">…</span> <button class="mini" data-target="qnh">退出</button></span>
    </div>
    <div class="row">
      <span class="k">1688</span>
      <span class="v"><span class="st off" id="st-1688">…</span> <button class="mini" data-target="1688">退出</button></span>
    </div>
    <div class="msg" id="logoutMsg"></div>
  </div>

  <div class="card" id="unboundCard" style="display:none">
    <div class="tip">
      尚未绑定账号。请到网站看板点「<b>绑定本机助手</b>」——浏览器会弹窗询问是否打开本助手，点「打开」即可自动完成绑定。
    </div>
    <div class="tip" id="bindErr" style="display:none;margin-top:8px;color:var(--err)"></div>
  </div>

  <div class="btns">
    <button id="btnData">打开数据目录</button>
    <button class="danger" id="btnUnbind">解绑</button>
    <button id="btnQuit">退出程序</button>
  </div>

  <p class="tip" style="margin-top:12px">
    隐私说明：本程序<b>不读取、不上传</b>你的 1688 账号密码与 Cookie；登录态只保存在本机；
    除连接你自己的服务器外不发起任何网络请求。
  </p>
</div>

<script>
const S = { connected:false, ready:false, sending:false, loggedIn:false };
function dot(cls){ return '<i class="dot ' + cls + '"></i>'; }
function render(s){
  Object.assign(S, s || {});
  document.getElementById('ver').textContent = S.version ? 'v' + S.version : '';
  const conn = document.getElementById('conn');
  if (!S.bound) conn.innerHTML = dot('n') + '未绑定';
  else if (S.ready) conn.innerHTML = dot('g') + '已连接';
  else if (S.connected) conn.innerHTML = dot('y') + '握手中…';
  else conn.innerHTML = dot('r') + '未连接（重连中）';
  document.getElementById('login').innerHTML = S.loggedIn ? (dot('g') + '已登录') : (dot('y') + '未登录（发送前请先登录）');
  document.getElementById('server').textContent = S.serverUrl || '—';
  document.getElementById('device').textContent = S.deviceName || '—';
  const be = document.getElementById('bindErr');
  if (be) {
    // 绑定令牌 2 分钟有效：过期了就明说，别让用户在看板干等「已唤起」的假象
    be.style.display = S.bindError ? 'block' : 'none';
    if (S.bindError) be.textContent = '上一次绑定没成功：' + S.bindError + '。多半是令牌过期了，回到看板再点一次「绑定本机助手」即可。';
  }
  document.getElementById('unboundCard').style.display = S.bound ? 'none' : 'block';
  const st = document.getElementById('taskState');
  if (S.sending) {
    const t = S.sendState || {};
    st.textContent = '发送中 ' + (t.done||0) + '/' + (t.total||0) + (t.current ? ' · 当前 ' + t.current : '');
  } else st.textContent = '空闲';
  document.getElementById('btnStop').classList.toggle('hide', !S.sending);
}
document.getElementById('btnLogin').onclick = () => window.xsh.openLoginWindow();
document.getElementById('btnStop').onclick = () => window.xsh.stopTask();

// ── 本机登录态：只区分「已登录 / 未登录」，并支持手动退出 ──
const TARGET_NAME = { pdd: '拼多多', qnh: '牵牛花', '1688': '1688' };
function renderLocal(map) {
  Object.keys(TARGET_NAME).forEach((k) => {
    const el = document.getElementById('st-' + k);
    if (!el) return;
    const v = (map || {})[k] || {};
    const n = Number(v.cookies);
    const btn = document.querySelector('button[data-target="' + k + '"]');
    if (!(n >= 0)) {
      el.className = 'st off'; el.textContent = '状态未知';
      if (btn) btn.disabled = false;
      return;
    }
    // 用户只关心「登没登录」，不关心攒了多少个 Cookie
    el.className = n ? 'st on' : 'st off';
    el.textContent = n ? '已登录' : '未登录';
    // 没登录就没有可退的，按钮置灰（读不到状态时仍允许手动退）
    if (btn) btn.disabled = !n;
  });
}
async function refreshLocal() {
  try { renderLocal(await window.xsh.localState()); } catch (e) { /* 忽略 */ }
}
function showLogoutMsg(text, ok) {
  const el = document.getElementById('logoutMsg');
  if (!el) return;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
  clearTimeout(showLogoutMsg._t);
  showLogoutMsg._t = setTimeout(() => { el.className = 'msg'; }, 8000);
}
Array.prototype.forEach.call(document.querySelectorAll('button[data-target]'), (btn) => {
  btn.onclick = async () => {
    const target = btn.getAttribute('data-target');
    const name = TARGET_NAME[target] || target;
    const ok = confirm(
      '退出本机「' + name + '」账号？\n\n'
      + '退出后下次登录需要重新扫码 / 短信验证；已同步到服务器的数据不受影响。\n'
      + '（同一台电脑上多个账号共用这一个登录窗口，退出的是这台机器上最后登录的那个账号。）'
    );
    if (!ok) return;
    btn.disabled = true;
    try {
      const r = await window.xsh.logout(target);
      if (r && r.ok) {
        showLogoutMsg('✓ 已退出本机「' + name + '」账号'
          + ((r.closedWindows || 0) > 0 ? '（关闭 ' + r.closedWindows + ' 个窗口）' : ''), true);
      } else {
        showLogoutMsg('✗ 退出失败：' + ((r && (r.error || ('仍有 ' + r.remain + ' 个 Cookie'))) || '未知错误'), false);
      }
    } catch (e) {
      showLogoutMsg('✗ 退出失败：' + (e && e.message ? e.message : e), false);
    } finally {
      btn.disabled = false;
      await refreshLocal();
    }
  };
});

window.xsh.onState(render);
window.xsh.getState().then(render);
document.getElementById('btnData').onclick = () => window.xsh.openDataDir();
document.getElementById('btnQuit').onclick = () => window.xsh.quit();
document.getElementById('btnUnbind').onclick = async () => {
  if (!confirm('解绑后本机将断开与服务器的连接，需要重新到网站绑定。确定解绑？')) return;
  await window.xsh.unbind();
};
refreshLocal();
setInterval(refreshLocal, 10000);          // 网站那边点「退出账号」后，这里最多 10 秒跟着变
window.addEventListener('focus', refreshLocal);

// ── 版本更新横幅 ───────────────────────────────────────────────────
// 服务器说版本过旧 → 这里显红色卡片。点「立即更新」由主进程下载安装包并拉起安装程序，
// 装完自动启动新版；这个老进程会自己退出（见 main.js 的 doSelfUpdate）。
const updEls = {
  card: document.getElementById('updCard'),
  ver: document.getElementById('updVer'),
  desc: document.getElementById('updDesc'),
  barWrap: document.getElementById('updBarWrap'),
  bar: document.getElementById('updBar'),
  btn: document.getElementById('btnUpdate'),
  btnLater: document.getElementById('btnUpdateLater'),
  msg: document.getElementById('updMsg'),
};
let updSnoozed = false;      // 点了「稍后」→ 这次运行不再弹，重连后会再提醒

function showUpdMsg(text, ok) {
  updEls.msg.textContent = text || '';
  updEls.msg.className = 'msg ' + (text ? (ok ? 'ok' : 'err') : '');
}

function renderUpdate(s) {
  if (!s) return;
  const need = !!(s.info && s.latestVersion);
  updEls.card.style.display = (need && !(updSnoozed && !s.blocking)) ? '' : 'none';
  if (!need) return;
  updEls.ver.textContent = `v${s.currentVersion || '?'} → v${s.latestVersion}`;

  const busy = s.phase === 'downloading' || s.phase === 'installing';
  const hasUrl = !!(s.info && s.info.updateUrl);
  updEls.btn.disabled = busy || !hasUrl;
  updEls.btn.textContent = s.phase === 'downloading' ? '正在下载…'
    : (s.phase === 'installing' ? '安装中…' : (hasUrl ? '立即更新' : '暂无下载地址'));

  let desc = '';
  if (s.blocking) desc = '旧版本已被停用：登录、申请发票、发送消息等功能现在都用不了，必须更新后才恢复。';
  else desc = '旧版本目前还能用，但宽限期结束后会被停用，建议尽快更新——新版停止响应更快、发送也更省时间。';
  if (!hasUrl) desc += '⚠ 这台服务器没有提供安装包（也没配外部直链），请联系管理员索取新版。';
  if (s.phase === 'installing') desc = '安装程序已打开：按向导一路下一步，装完会自动拉开新版助手。';
  updEls.desc.textContent = desc;

  if (s.phase === 'downloading') {
    updEls.barWrap.className = 'bar on';
    updEls.bar.style.width = (s.percent || 0) + '%';
    showUpdMsg((s.percent || 0) + '% · ' + (s.message || ''), true);
  } else if (s.phase === 'error') {
    updEls.barWrap.className = 'bar';
    showUpdMsg('✗ ' + (s.error || '更新失败'), false);
  } else if (s.phase === 'installing') {
    updEls.barWrap.className = 'bar on';
    updEls.bar.style.width = '100%';
    showUpdMsg(s.message || '', true);
  } else {
    updEls.barWrap.className = 'bar';
    showUpdMsg('', true);
  }
  // 已被停用的版本不给「稍后」：躲不掉，也不该给一个会误导的按钮
  updEls.btnLater.style.display = s.blocking ? 'none' : '';
}

updEls.btn.onclick = async () => {
  updEls.btn.disabled = true;
  showUpdMsg('正在连接服务器下载安装包…', true);
  try {
    const r = await window.xsh.doUpdate();
    if (r && r.ok) {
      showUpdMsg('✓ 安装程序已打开，本助手即将退出。装完会自动启动新版。', true);
    } else {
      showUpdMsg('✗ ' + ((r && r.error) || '更新失败'), false);
      updEls.btn.disabled = false;
    }
  } catch (e) {
    showUpdMsg('✗ ' + (e && e.message ? e.message : e), false);
    updEls.btn.disabled = false;
  }
};
updEls.btnLater.onclick = () => {
  updSnoozed = true;
  updEls.card.style.display = 'none';
};

window.xsh.onUpdate(renderUpdate);
window.xsh.updateState().then(renderUpdate).catch(() => { /* 老主进程没有这个接口就跳过 */ });
</script>
</body>
</html>
