<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 发票催收</title>
<!-- 品牌图标：/favicon.ico 与 /assets/* 由 server.js 白名单式下发 -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/logo-icon.png">
<!-- Element UI（本地 vendor，免外网 CDN） -->
<link rel="stylesheet" href="/vendor/element-ui/index.css">
<style>
  :root { --primary: #ff6a00; --bg: #f5f6f8; --border: #e8e9eb; --text: #26282c; --sub: #8a8f99; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [v-cloak] { display: none; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #fff4ec 0%, #f5f6f8 55%, #eef2f7 100%);
    padding: 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand .logo { width: 36px; height: 36px; display: block; object-fit: contain; flex: none; }
  .brand h1 { font-size: 17px; }
  .subtitle { color: var(--sub); font-size: 12px; margin: 8px 0 18px; line-height: 1.7; }
  .foot { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--sub); line-height: 1.8; }
  .foot b { color: var(--text); }
  /* Element 品牌色覆盖 */
  .el-button--primary { background-color: #ff6a00; border-color: #ff6a00; }
  .el-button--primary:hover, .el-button--primary:focus { background-color: #ff8533; border-color: #ff8533; }
  .el-input__inner:focus { border-color: #ff6a00; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <el-card shadow="always" style="width:100%;max-width:400px;border-radius:14px" :body-style="{ padding: '30px 30px 24px' }">
    <div class="brand">
      <img class="logo" src="/assets/logo-icon.png" alt="">
      <h1>发票催收登录</h1>
    </div>
    <div class="subtitle">登录账号就是公司全称（开票抬头），联系管理员进行创建。</div>

    <el-alert v-if="err" type="error" :title="err" :closable="false" show-icon style="margin-bottom:14px"></el-alert>

    <el-form @submit.native.prevent="submit" autocomplete="on">
      <el-form-item label="公司全称（登录账号）">
        <el-input id="username" name="username" v-model="username" autocomplete="username"
                  placeholder="阿里巴巴贸易有限公司" @keyup.enter.native="submit"></el-input>
      </el-form-item>
      <el-form-item label="密码">
        <el-input id="password" name="password" type="password" v-model="password" autocomplete="current-password"
                  placeholder="请输入密码" show-password @keyup.enter.native="submit"></el-input>
      </el-form-item>
      <el-button type="primary" style="width:100%;margin-top:4px" :loading="loading" native-type="submit" @click="submit">登 录</el-button>
    </el-form>

  </el-card>
</div>

<script src="/vendor/vue.min.js"></script>
<script src="/vendor/element-ui/index.js"></script>
<script>
Vue.use(ELEMENT);
Vue.config.productionTip = false;
new Vue({
  el: '#app',
  data: { username: '', password: '', err: '', loading: false },
  methods: {
    // 已登录则直接进入看板
    async checkLogged() {
      try { const r = await fetch('/api/auth/me', { credentials: 'same-origin' }); if (r.ok) location.href = '/'; } catch (e) {}
    },
    async submit() {
      this.err = '';
      const username = this.username.trim(), password = this.password;
      if (!username || !password) { this.err = '请输入账号与密码'; return; }
      this.loading = true;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { location.href = '/'; return; }
        this.err = d.error || ('登录失败（HTTP ' + r.status + '）');
      } catch (e) { this.err = '网络异常：' + e.message; }
      this.loading = false;
    },
  },
  mounted() { this.checkLogged(); },
});
</script>
</body>
</html>
