<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>补货单</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#f5f7fa; --card:#fff; --text:#1f2d3d; --text2:#7b8794; --line:#e4e7ed;
          --pri:#409eff; --err:#f56c6c; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto;
    padding: 18px 14px calc(28px + env(safe-area-inset-bottom)); }
  header { padding: 6px 4px 14px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  .sub { margin: 0; font-size: 13px; color: var(--text2); }
  .sub.bad { color: var(--err); }
  .card { background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .pick { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: #eef1f5; }
  .pick.void { display:flex; align-items:center; justify-content:center; color:#c0c4cc;
    font-size:11px; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 14.5px; line-height: 1.4; word-break: break-all; }
  .row2 { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; flex-wrap: wrap;
    font-size: 13.5px; color: var(--text); }
  .spec { color: var(--text2); }
  .qty { font-weight: 600; color: var(--pri); }
  .msg { font-size: 13.5px; padding: 12px 14px; border-radius: 10px; background: #fef0f0;
    color: #c45656; }
  .msg.ok { background: #f0f9eb; color: #529b2e; }
  .msg:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">补货单</h1>
    <p class="sub" id="sub">正在校验链接…</p>
  </header>

  <div class="card" id="card" hidden>
    <ul id="list"></ul>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  'use strict';
  var QS = new URLSearchParams(location.search);
  var T = QS.get('t') || '';
  // 短链：/r/<令牌>
  if (!T) {
    var m = /^\/r\/([\w.-]+)$/.exec(location.pathname || '');
    if (m) T = m[1];
  }
  var $ = function (id) { return document.getElementById(id); };

  function render(d) {
    // 标题 = 生成日期-补货单，格式 YYYYMMDD-补货单
    var ds = String(d.createdAt || '').replace(/[^\d]/g, '').slice(0, 8);
    if (!ds) {
      var now = new Date();
      ds = now.getFullYear()
        + String(now.getMonth() + 1).padStart(2, '0')
        + String(now.getDate()).padStart(2, '0');
    }
    $('title').textContent = ds + '-补货单';
    $('sub').textContent = '';

    var list = $('list');
    list.innerHTML = '';
    (d.items || []).forEach(function (it) {
      var li = document.createElement('li');

      var pick;
      if (it.imageUrl) {
        pick = document.createElement('img');
        pick.className = 'pick';
        pick.src = it.imageUrl;
        pick.loading = 'lazy';
        pick.onerror = function () { pick.onerror = null; pick.outerHTML = voidBlock(); };
      } else {
        pick = voidBlock();
      }
      li.appendChild(pick);

      var info = document.createElement('div');
      info.className = 'info';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.goodsName || '—';
      info.appendChild(name);
      var row2 = document.createElement('div');
      row2.className = 'row2';
      var spec = document.createElement('span');
      spec.className = 'spec';
      spec.textContent = '规格 ' + (Number(it.specQty) > 0 ? it.specQty : 1) + '/件';
      row2.appendChild(spec);
      var qty = document.createElement('span');
      qty.className = 'qty';
      qty.textContent = '下单数量 ' + (it.qtyPack || 0) + ' 件';
      row2.appendChild(qty);
      info.appendChild(row2);
      li.appendChild(info);
      list.appendChild(li);
    });
    $('card').hidden = false;
  }

  function voidBlock() {
    var p = document.createElement('div');
    p.className = 'pick void';
    p.textContent = '无图';
    return p;
  }

  function msg(text, ok) {
    var el = $('msg');
    el.textContent = text || '';
    el.className = 'msg' + (ok ? ' ok' : '');
  }

  function load() {
    if (!T) {
      $('sub').textContent = '链接不完整';
      $('sub').className = 'sub bad';
      msg('请回到电脑上，在「补货单详情」里重新点「补货链接」生成');
      return;
    }
    fetch('/api/pub/replenish?t=' + encodeURIComponent(T), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) {
          $('sub').textContent = '链接不可用';
          $('sub').className = 'sub bad';
          msg((d && d.error) || '链接已失效');
          return;
        }
        render(d);
      })
      .catch(function () {
        $('sub').textContent = '网络异常';
        $('sub').className = 'sub bad';
        msg('加载失败，请检查手机是否和服务器在同一网络后重试');
      });
  }

  load();
})();
</script>
</body>
</html>
